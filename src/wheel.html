<style>

  svg { display: block; width: 620px; height: 620px; }

  #wheel { filter: drop-shadow(0 5px 10px rgba(60, 20, 0, .20)); }

  .glass .seg, .glass .cseg { fill: url(#gPetalG); filter: none; stroke: rgba(255, 251, 238, .55); stroke-width: 1.2; }
  .hot { fill: url(#gHot) !important; stroke: rgba(255, 176, 140, .55); }

  .hot ~ .ic { stroke: #fff; }

         background: linear-gradient(#f6cc88, #f2af9a); color: #2b1006; font-weight: 700; font-size: 13px; letter-spacing: .03em;
         border: 1.5px solid rgba(255, 246, 228, .7); box-shadow: 0 4px 12px rgba(80, 25, 0, .35); opacity: 0; transition: opacity .15s; }
  #msg.on { opacity: 1; }
</style>
<svg viewBox="0 0 620 620" id="svg"></svg>
<div id="msg"></div>
<script>
  // --- Cosa si può fare con ciascun tipo di file --------------------------------------------------
  // Ogni voce della ruota è { id, label }: gli id dei video iniziano con "vid:" e aprono la finestra Video.
  const IMG_TARGETS = ['png', 'webp', 'jpg', 'tiff', 'avif', 'bmp', 'gif', 'pdf', 'docx'];
  const VIDEO_TARGETS = ['mp4', 'mov', 'mkv', 'webm', 'avi', 'gif', 'mp3', 'wav']; // gli altri formati (WMV, FLV, FLAC, OGG...) si scelgono con ALTRO nella finestra
  const IMG_ACTIONS = ['crop', 'resize', 'removebg'];
  const VID_ACTIONS = ['vid:compress', 'vid:resize', 'vid:cut', 'vid:frames', 'aud:split']; // aud:split = separa voce e musica dall'audio del video
  const AUDIO_TARGETS = ['mp3', 'm4a', 'wav', 'flac', 'ogg', 'opus', 'aac', 'aiff', 'wma'];
  const AUD_ACTIONS = ['aud:cut', 'aud:merge', 'aud:volume', 'aud:split'];
  const SHEET_TARGETS = ['xlsx', 'xls', 'ods', 'csv', 'tsv', 'json', 'html', 'pdf', 'sql'];
  const XL_ACTIONS = ['xl:split', 'xl:merge', 'xl:clean', 'xl:diff'];
  const DOC_TARGETS = ['pdf', 'txt', 'html', 'md', 'images'];
  const DX_ACTIONS = ['dx:merge', 'dx:compress', 'dx:clean', 'dx:replace'];
  const DATA_FORMATS = ['json', 'yaml', 'toml', 'xml'];
  const DATA_ACTIONS = { json: ['data:format', 'data:minify', 'data:validate', 'data:types'], yaml: ['data:format', 'data:validate', 'data:types'], toml: ['data:format', 'data:validate', 'data:types'], xml: ['data:format', 'data:minify', 'data:validate'] };
  const dat = (t) => ({ id: 'data:convert:' + t, label: t.toUpperCase() });
  const PDF_ACTIONS = ['pdf:edit', 'pdf:pages', 'pdf:merge', 'pdf:sign', 'pdf:protect', 'pdf:compress'];
  const SINGLE_ONLY = new Set(['crop', 'vid:cut', 'vid:frames', 'aud:cut', 'pdf:edit', 'pdf:pages']); // azioni che lavorano su un file alla volta
  const MULTI_ONLY = new Set(['pdf:merge']); // azioni che servono solo con più file
  const LABEL = { crop: 'Ritaglia', resize: 'Ridimensiona', removebg: 'Rimuovi\nsfondo', 'vid:compress': 'Comprimi', 'vid:resize': 'Ridimensiona', 'vid:cut': 'Taglia', 'vid:frames': 'Fotogrammi', 'aud:cut': 'Taglia', 'aud:merge': 'Unisci', 'aud:volume': 'Volume', 'aud:split': 'Voce e\nmusica', 'xl:split': 'Dividi', 'xl:merge': 'Unisci', 'xl:clean': 'Pulisci', 'xl:diff': 'Confronta', 'dx:merge': 'Unisci', 'dx:compress': 'Comprimi', 'dx:clean': 'Pulisci', 'dx:replace': 'Sostituisci', 'pdf:edit': 'Modifica', 'pdf:pages': 'Pagine', 'pdf:merge': 'Unisci', 'pdf:sign': 'Firma', 'pdf:protect': 'Proteggi', 'pdf:compress': 'Comprimi', 'data:format': 'Formatta', 'data:minify': 'Minifica', 'data:validate': 'Valida', 'data:types': 'Tipi TS\ne schema', 'zip:create': 'Comprimi\nin ZIP', 'zip:extract': 'Estrai' };
  const T = (id) => ({ id, label: id.toUpperCase() });
  const vt = (t) => ({ id: 'vid:convert:' + t, label: t.toUpperCase() });
  const at = (t) => ({ id: 'aud:convert:' + t, label: t.toUpperCase() });
  const dt = (t) => ({ id: 'dx:convert:' + t, label: t === 'images' ? 'IMMAGINI' : t.toUpperCase() });
  const xt = (t) => ({ id: 'xl:convert:' + t, label: t.toUpperCase() });

  const KIND_BY_MIME = {
    'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/avif': 'avif', 'image/tiff': 'tiff',
    'image/bmp': 'bmp', 'image/x-ms-bmp': 'bmp', 'image/gif': 'gif', 'image/svg+xml': 'svg',
    'application/pdf': 'pdf',
    'application/vnd.openxmlformats-officedocument.wordprocessingml.document': 'docx',
    'video/mp4': 'mp4', 'video/x-m4v': 'mp4', 'video/quicktime': 'mov', 'video/webm': 'webm', 'video/x-matroska': 'mkv', 'video/x-msvideo': 'avi',
    'video/x-ms-wmv': 'wmv', 'video/mpeg': 'mpg', 'video/3gpp': '3gp', 'video/ogg': 'ogv', 'video/mp2t': 'ts', 'video/x-flv': 'flv',
    'audio/mpeg': 'mp3', 'audio/mp3': 'mp3', 'audio/wav': 'wav', 'audio/x-wav': 'wav', 'audio/wave': 'wav', 'audio/mp4': 'm4a', 'audio/x-m4a': 'm4a', 'audio/aac': 'aac',
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': 'xlsx', 'application/vnd.ms-excel.sheet.macroenabled.12': 'xlsx',
    'application/vnd.ms-excel': 'xls', 'application/vnd.oasis.opendocument.spreadsheet': 'ods', 'text/csv': 'csv', 'text/tab-separated-values': 'tsv',
    'application/json': 'json', 'text/json': 'json', 'application/xml': 'xml', 'text/xml': 'xml', 'application/yaml': 'yaml', 'application/x-yaml': 'yaml', 'text/yaml': 'yaml', 'text/x-yaml': 'yaml', 'application/toml': 'toml',
    'text/markdown': 'md', 'text/x-markdown': 'md', 'text/html': 'html', 'application/zip': 'zip', 'application/x-zip-compressed': 'zip', 'application/x-zip': 'zip',
    'audio/flac': 'flac', 'audio/x-flac': 'flac', 'audio/ogg': 'ogg', 'audio/opus': 'opus', 'audio/x-ms-wma': 'wma', 'audio/aiff': 'aiff', 'audio/x-aiff': 'aiff',
  };
  // Windows non sempre indica il tipo durante il trascinamento (per esempio per MKV): al rilascio si usa l'estensione
  const KIND_BY_EXT = {
    png: 'png', jpg: 'jpg', jpeg: 'jpg', webp: 'webp', avif: 'avif', tif: 'tiff', tiff: 'tiff', bmp: 'bmp', gif: 'gif', svg: 'svg', pdf: 'pdf', docx: 'docx',
    mp4: 'mp4', m4v: 'mp4', mov: 'mov', webm: 'webm', mkv: 'mkv', avi: 'avi', wmv: 'wmv', flv: 'flv', mpg: 'mpg', mpeg: 'mpg', '3gp': '3gp', ts: 'ts', mts: 'ts', m2ts: 'ts', ogv: 'ogv',
    xlsx: 'xlsx', xlsm: 'xlsx', xls: 'xls', ods: 'ods', csv: 'csv', tsv: 'tsv',
    json: 'json', yaml: 'yaml', yml: 'yaml', toml: 'toml', xml: 'xml', md: 'md', markdown: 'md', html: 'html', htm: 'html', zip: 'zip',
    mp3: 'mp3', m4a: 'm4a', m4b: 'm4a', aac: 'aac', wav: 'wav', flac: 'flac', ogg: 'ogg', oga: 'ogg', opus: 'opus', wma: 'wma', aif: 'aiff', aiff: 'aiff',
  };
  const VIDEO_KINDS = new Set(['mp4', 'mov', 'webm', 'mkv', 'avi', 'wmv', 'flv', 'mpg', '3gp', 'ts', 'ogv']);
  const SHEET_KINDS = new Set(['xlsx', 'xls', 'ods', 'csv', 'tsv']); // Windows annuncia i CSV come xls se c'è Excel: al rilascio decide l'estensione
  const AUDIO_KINDS = new Set(['mp3', 'm4a', 'aac', 'wav', 'flac', 'ogg', 'opus', 'wma', 'aiff']);

  // formati di uscita e azioni per tipo di ingresso
  function optionsFor(kind) {
    if (VIDEO_KINDS.has(kind)) return { targets: [...VIDEO_TARGETS.filter((t) => t !== kind).map(vt), { id: 'vid:convert', label: 'ALTRO' }], actions: VID_ACTIONS };
    if (AUDIO_KINDS.has(kind)) return { targets: AUDIO_TARGETS.filter((t) => t !== kind).map(at), actions: AUD_ACTIONS };
    if (SHEET_KINDS.has(kind)) return { targets: SHEET_TARGETS.filter((t) => t !== kind).map(xt), actions: XL_ACTIONS };
    if (kind === 'gif') return { targets: [...IMG_TARGETS.filter((t) => t !== 'gif').map(T), vt('mp4'), vt('webm')], actions: IMG_ACTIONS };
    if (kind === 'pdf') return { targets: ['png', 'webp', 'jpg', 'tiff', 'avif', 'bmp', 'gif', 'docx', 'txt'].map(T), actions: PDF_ACTIONS };
    if (kind === 'docx') return { targets: DOC_TARGETS.map(dt), actions: DX_ACTIONS };
    if (DATA_ACTIONS[kind]) return { targets: [...DATA_FORMATS, 'csv', 'sql'].filter((t) => t !== kind && !(kind === 'xml' && t === 'sql')).map(dat), actions: DATA_ACTIONS[kind] };
    if (kind === 'md') return { targets: [{ id: 'web:html', label: 'HTML' }, { id: 'web:pdf', label: 'PDF' }], actions: [] };
    if (kind === 'html') return { targets: [{ id: 'web:pdf', label: 'PDF' }], actions: [] };
    if (kind === 'zip') return { targets: [], actions: ['zip:extract'] };
    return { targets: IMG_TARGETS.filter((f) => f !== kind).map(T), actions: IMG_ACTIONS }; // immagini
  }
  // Stato senza opzioni: la pillola al centro dice perché (pill) e il messaggio in basso lo spiega (note)
  const none = (pill, note) => ({ targets: [], actions: [], pill, note });
  // più file (tutti di tipo noto): solo ciò che vale per tutti
  function optionsForKinds(kinds, count) {
    const all = kinds.map(optionsFor);
    const label = [...new Set(kinds)].map((k) => k.toUpperCase()).join(' + ');
    const o = {
      label,
      targets: all[0].targets.filter((t) => all.every((o) => o.targets.some((x) => x.id === t.id))),
      actions: all[0].actions.filter((a) => all.every((o) => o.actions.includes(a)) && (!SINGLE_ONLY.has(a) || count === 1) && (!MULTI_ONLY.has(a) || count > 1) && (a !== 'xl:diff' || count === 2)),
    };
    return o.targets.length || o.actions.length ? o : none([label, 'nessuna opzione', 'in comune'], `${label}: insieme non hanno opzioni in comune, trascinali separatamente`);
  }
  // Durante il trascinamento si conosce solo il tipo annunciato da Windows (MIME). Per le cartelle e per alcuni file
  // non c'è: la ruota non propone nulla e il controllo vero (cartella? estensione?) si fa al rilascio, in checkDrop.
  function optionsForTypes(mimes) {
    if (!mimes.length) return null;
    if (mimes.some((m) => !m)) return none(['Rilascia qui', 'per controllare'], 'Windows non dice che cosa stai trascinando (forse una cartella): rilascia per controllare');
    const kinds = mimes.map((m) => KIND_BY_MIME[m]);
    if (kinds.some((k) => !k)) {
      const what = [...new Set(mimes.filter((m, i) => !kinds[i]).map((m) => m.split('/').pop().replace(/^(x-|vnd\.)/, '').split(/[.+-]/)[0].toUpperCase()))].join(', ');
      return none(['Formato non', 'supportato'], `${what}: formato non supportato da DragWheel`);
    }
    return optionsForKinds(kinds, mimes.length);
  }
  const kindOfPath = (p) => KIND_BY_EXT[(String(p).split('.').pop() || '').toLowerCase()];

  // --- Geometria e aspetto -------------------------------------------------------------------------
  const C = 310;          // centro
  const RIM = 272;        // bordo esterno della cornice di vetro
  const R_OUT = 257;      // bordo esterno dei petali
  const R_IN = 125;       // bordo interno dei petali
  const R_HUB = 115;      // cerchio centrale con il suo bordo dorato
  const R_C = 103;        // raggio dei petali delle azioni al centro
  const svg = document.getElementById('svg'), msg = document.getElementById('msg');
  const NS = 'http://www.w3.org/2000/svg';
  const rad = (d) => (d * Math.PI) / 180;
  const pt = (r, deg) => [C + r * Math.cos(rad(deg)), C + r * Math.sin(rad(deg))];

  function el(name, attrs, parent = svg) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  // Petalo: settore di corona con angoli arrotondati e bordi paralleli (spazio costante fra petali vicini)
  function petalPath(rIn, rOut, a0, a1, gap, cOut, cIn) {
    const o = gap / 2, A0 = rad(a0), A1 = rad(a1);
    const rot = (a, x, y) => [C + Math.cos(a) * x - Math.sin(a) * y, C + Math.sin(a) * x + Math.cos(a) * y];
    const corner = (R, c, inner) => {
      const rho = inner ? R + c : R - c, d = Math.asin((o + c) / rho);
      return { edge: [rho * Math.cos(d), o], arc: [R * Math.cos(d), R * Math.sin(d)] };
    };
    const fo = corner(rOut, cOut, false), fi = corner(rIn, cIn, true);
    const L = (f, k) => rot(A0, f[k][0], f[k][1]), R = (f, k) => rot(A1, f[k][0], -f[k][1]);
    const p = (q) => `${q[0].toFixed(2)} ${q[1].toFixed(2)}`;
    return `M${p(L(fi, 'edge'))} L${p(L(fo, 'edge'))} A${cOut} ${cOut} 0 0 1 ${p(L(fo, 'arc'))} A${rOut} ${rOut} 0 0 1 ${p(R(fo, 'arc'))} `
      + `A${cOut} ${cOut} 0 0 1 ${p(R(fo, 'edge'))} L${p(R(fi, 'edge'))} A${cIn} ${cIn} 0 0 1 ${p(R(fi, 'arc'))} `
      + `A${rIn} ${rIn} 0 0 0 ${p(L(fi, 'arc'))} A${cIn} ${cIn} 0 0 1 ${p(L(fi, 'edge'))} Z`;
  }

  // Icone a linea per le azioni (viewBox 24x24)
  const ICONS = {
    crop: ['M6 2v14a2 2 0 0 0 2 2h14', 'M18 22V8a2 2 0 0 0-2-2H2'],
    resize: ['M15 3h6v6', 'M9 21H3v-6', 'M21 3l-7 7', 'M3 21l7-7'],
    removebg: ['M12 11.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z', 'M5.5 20.5c0-3.4 2.9-5.8 6.5-5.8s6.5 2.4 6.5 5.8', 'M3.5 6V3.5H6', 'M18 3.5h2.5V6', 'M3.5 18v2.5H6', 'M18 20.5h2.5V18'],
    'vid:compress': ['M4 14h6v6', 'M20 10h-6V4', 'M14 10l7-7', 'M3 21l7-7'],
    'vid:resize': ['M15 3h6v6', 'M9 21H3v-6', 'M21 3l-7 7', 'M3 21l7-7'],
    'vid:cut': ['M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', 'M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', 'M20 4L8.1 15.9', 'M14.5 14.5L20 20', 'M8.1 8.1L12 12'],
    'xl:split': ['M16 3h5v5', 'M8 3H3v5', 'M12 22v-8.3a4 4 0 0 0-1.17-2.87L3 3', 'M15 9l6-6'],
    'xl:merge': ['M8 6l4-4 4 4', 'M12 2v10.3a4 4 0 0 1-1.17 2.87L4 22', 'M20 22l-5-5'],
    'xl:clean': ['M3 21l9-9', 'M15 4V2', 'M15 16v-2', 'M8 9h2', 'M20 9h2', 'M17.8 11.8L19 13', 'M17.8 6.2L19 5', 'M12.2 6.2L11 5'],
    'dx:merge': ['M8 6l4-4 4 4', 'M12 2v10.3a4 4 0 0 1-1.17 2.87L4 22', 'M20 22l-5-5'],
    'dx:compress': ['M4 14h6v6', 'M20 10h-6V4', 'M14 10l7-7', 'M3 21l7-7'],
    'dx:clean': ['M3 21l9-9', 'M15 4V2', 'M15 16v-2', 'M8 9h2', 'M20 9h2', 'M17.8 11.8L19 13', 'M17.8 6.2L19 5', 'M12.2 6.2L11 5'],
    'dx:replace': ['M17 3l4 4-4 4', 'M3 7h18', 'M7 21l-4-4 4-4', 'M21 17H3'],
    'xl:diff': ['M18 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', 'M6 12a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', 'M13 6h3a2 2 0 0 1 2 2v7', 'M11 18H8a2 2 0 0 1-2-2V9'],
    'aud:cut': ['M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', 'M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', 'M20 4L8.1 15.9', 'M14.5 14.5L20 20', 'M8.1 8.1L12 12'],
    'aud:merge': ['M11 12H3', 'M16 6H3', 'M16 18H3', 'M18 9v6', 'M21 12h-6'],
    'aud:split': ['M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z', 'M19 10v1a7 7 0 0 1-14 0v-1', 'M12 18v4', 'M8 22h8'],
    'aud:volume': ['M11 5L6 9H2v6h4l5 4V5z', 'M15.5 8.5a5 5 0 0 1 0 7', 'M19 5a10 10 0 0 1 0 14'],
    'pdf:edit': ['M12 20h9', 'M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z'],
    'pdf:pages': ['M12 2l10 5-10 5L2 7z', 'M2 17l10 5 10-5', 'M2 12l10 5 10-5'],
    'pdf:merge': ['M8 6l4-4 4 4', 'M12 2v10.3a4 4 0 0 1-1.17 2.87L4 22', 'M20 22l-5-5'],
    'pdf:sign': ['M3 17c3-3 5-9 7-9s-1 9 2 9 3-4 5-4 2 3 4 3', 'M3 21h18'],
    'pdf:protect': ['M5 11h14v10H5z', 'M8 11V7a4 4 0 0 1 8 0v4', 'M12 15v2'],
    'pdf:compress': ['M4 14h6v6', 'M20 10h-6V4', 'M14 10l7-7', 'M3 21l7-7'],
    'data:format': ['M21 10H7', 'M21 6H3', 'M21 14H3', 'M21 18H7'],
    'data:minify': ['M4 14h6v6', 'M20 10h-6V4', 'M14 10l7-7', 'M3 21l7-7'],
    'data:validate': ['M22 11.1V12a10 10 0 1 1-5.9-9.1', 'M22 4L12 14l-3-3'],
    'data:types': ['M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1', 'M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1'],
    'zip:create': ['M21 8v13H3V8', 'M1 3h22v5H1z', 'M10 12h4'],
    'zip:extract': ['M21 8v13H3V8', 'M1 3h22v5H1z', 'M12 11v6', 'M9 14l3 3 3-3'],
    'vid:frames': ['M4 7.5h3l1.8-2.5h6.4L17 7.5h3a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5a1 1 0 0 1 1-1z', 'M12 16.2a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2z'],
  };
  function icon(id, cx, cy, size, parent) {
    const paths = ICONS[id];
    if (!paths) return;
    const g = el('g', { class: 'ic', transform: `translate(${cx - size / 2} ${cy - size / 2}) scale(${size / 24})` }, parent);
    paths.forEach((d) => el('path', { d }, g));
  }

  // testo su più righe (separate da a capo), centrato su (x, y)
  function label(x, y, text, cls, parent, step = 13) {
    const lines = text.split('\n');
    lines.forEach((t, i) => { el('text', { x, y: y + (i - (lines.length - 1) / 2) * step, class: cls }, parent).textContent = t.toUpperCase(); });
  }

  function defs() {
    const d = el('defs', {});
    const lin = (id, extent, stops) => {
      const g = el('linearGradient', { id, gradientUnits: 'userSpaceOnUse', x1: 0, y1: C - extent, x2: 0, y2: C + extent }, d);
      stops.forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, g));
    };
    lin('gPetal', R_OUT, [[0, '#f6cc88'], [1, '#f2af9a']]);
    lin('gHot', R_OUT, [[0, '#ea5638'], [1, '#c6420e']]);
    lin('gRing', RIM, [[0, '#cda85c'], [.5, '#c98e5e'], [1, '#ce9079']]);
    lin('gDisc', RIM, [[0, '#d9b266'], [.5, '#dcb27f'], [1, '#d9a998']]);
    lin('gHub', R_HUB, [[0, '#d98b3c'], [1, '#db7a3e']]);
    // modalità vetro: petali e cerchio centrale appena trasparenti, velo chiaro sopra la foto sfocata
    const lina = (id, extent, stops) => {
      const g = el('linearGradient', { id, gradientUnits: 'userSpaceOnUse', x1: 0, y1: C - extent, x2: 0, y2: C + extent }, d);
      stops.forEach(([o, c, a]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
    };
    lina('gPetalG', R_OUT, [[0, '#fff3da', .60], [1, '#ffe8d8', .47]]);      // petali: vetro, più chiaro vicino alla luce in alto
    lina('gFrost', RIM, [[0, '#fff5e6', .38], [1, '#fff1e4', .33]]);         // velo chiaro del disco
    lina('gHubG', R_HUB, [[0, '#8a3d06', .26], [1, '#9a4510', .26]]);        // cerchio centrale: vetro scuro che lascia passare l'arancione
    // riflesso della luce sul bordo: crema in alto, rosato in basso, quasi assente ai lati
    lina('gRimHi', RIM, [[0, '#fff8d2', 1], [.2, '#fff0bd', .85], [.5, '#f6e4b8', .22], [.8, '#ffe3cb', .85], [1, '#ffd9c6', 1]]);
    lina('gRimHi2', RIM, [[0, '#fff6c8', .8], [.25, '#fff0c2', .5], [.5, '#f3e0b4', .12], [.78, '#ffe3cd', .5], [1, '#ffdcc9', .75]]);
    const f = el('filter', { id: 'fBlur', x: '-5%', y: '-5%', width: '110%', height: '110%' }, d);
    el('feGaussianBlur', { stdDeviation: 17 }, f);
    el('feColorMatrix', { type: 'saturate', values: '0.92' }, f);
    const cp = el('clipPath', { id: 'cDisc' }, d);
    el('circle', { cx: C, cy: C, r: RIM }, cp);
  }

  // Cornice di vetro: con la foto dello schermo sfocata + velo chiaro; senza, un disco pesca opaco.
  // Il bordo non è una linea colorata ma un riflesso di luce (più forte in alto e in basso), con una fascia di vetro appena più scura.
  function frame(g) {
    if (glassUrl) {
      el('image', { href: glassUrl, x: 0, y: 0, width: 620, height: 620, preserveAspectRatio: 'none', 'clip-path': 'url(#cDisc)', filter: 'url(#fBlur)' }, g);
      el('circle', { cx: C, cy: C, r: RIM, fill: 'url(#gFrost)' }, g);
    } else {
      el('circle', { cx: C, cy: C, r: RIM, fill: 'url(#gDisc)' }, g);
    }
    el('circle', { cx: C, cy: C, r: (RIM + R_OUT + 6) / 2, fill: 'none', stroke: 'rgba(100, 70, 30, .20)', 'stroke-width': RIM - R_OUT - 6 }, g); // fascia esterna appena più scura
    el('circle', { cx: C, cy: C, r: R_OUT + 6.5, fill: 'none', stroke: 'url(#gRimHi2)', 'stroke-width': 1.3 }, g);                              // luce sul bordo interno della fascia
    el('circle', { cx: C, cy: C, r: RIM - 0.9, fill: 'none', stroke: 'url(#gRimHi)', 'stroke-width': 2 }, g);                                   // luce sul bordo esterno
  }
  // Cerchio centrale: vetro scuro con bordo di luce (nessun anello colorato)
  function hub(g) {
    el('circle', { cx: C, cy: C, r: R_HUB, fill: glassUrl ? 'url(#gHubG)' : 'url(#gHub)' }, g);
    el('circle', { cx: C, cy: C, r: R_HUB + 1, fill: 'none', stroke: 'rgba(90, 55, 20, .22)', 'stroke-width': 5 }, g);
    el('circle', { cx: C, cy: C, r: R_HUB + 3, fill: 'none', stroke: 'url(#gRimHi2)', 'stroke-width': 1.3 }, g);
    el('circle', { cx: C, cy: C, r: R_HUB - 3, fill: 'none', stroke: 'url(#gRimHi2)', 'stroke-width': 1 }, g);
  }

  // Bottone centrale a pillola con una o due righe di testo (stati senza azioni)
  function pill(lines, parent) {
    const longest = Math.max(...lines.map((t) => t.length)), size = Math.min(16, 196 / (longest * 0.74)); // il testo resta dentro il cerchio
    const h = 30 + lines.length * size * 1.18, w = Math.min(226, Math.max(180, longest * size * 0.74 + 34));
    const g = el('g', {}, parent);
    el('rect', { x: C - w / 2, y: C - h / 2, width: w, height: h, rx: Math.min(h, w) / 2, class: 'cseg', style: 'pointer-events:none' }, g);
    lines.forEach((t, i) => { el('text', { x: C, y: C + (i - (lines.length - 1) / 2) * size * 1.12, class: 't-pill', style: `font-size:${size.toFixed(1)}px` }, g).textContent = t.toUpperCase(); });
  }

  // Esegue l'azione/conversione scelta sui file (rilasciati o in attesa di un clic)
  async function run(files, id) {
    toast(id.startsWith('vid:') || id.startsWith('aud:') || id.startsWith('xl:') || id.startsWith('dx:') || id.startsWith('pdf:') || ['crop', 'resize', 'removebg'].includes(id) ? 'Apro lo strumento…'
      : id === 'zip:create' ? 'Creo lo ZIP…' : id === 'zip:extract' ? 'Estraggo…' : id === 'data:validate' ? 'Controllo…' : 'Conversione…', 600000);
    const res = await window.api.convert(files, id);
    const ok = res.filter((r) => r.outputs).length;
    const err = res.find((r) => r.error);
    if (res.every((r) => r.opened)) return toast('Apro lo strumento…', 1500);
    const short = (p) => String(p).split(/[\\/]/).pop();
    const msgs = res.filter((r) => r.message).map((r) => (res.length > 1 ? short(r.file) + ': ' : '') + r.message);
    if (msgs.length) return toast(msgs.join(' · ') + (err ? ` · ${err.error}` : ''), 7000);
    const made = res.flatMap((r) => r.outputs || []);
    toast(err ? `${ok}/${res.length} ok — ${err.error}` : made.length === 1 ? `✓ ${short(made[0])}` : `✓ ${made.length} file pronti`, 4000);
  }

  // Al rilascio i percorsi sono certi: cartelle e formati non supportati si dicono chiaramente e non si propone nulla.
  // id: opzione su cui è stato rilasciato il file (null = fuori dalle opzioni). Se vale per i file, si esegue; se no la
  // ruota si ridisegna con le opzioni giuste e basta un clic per applicarle (il tipo annunciato era sbagliato o mancante).
  let pending = null;
  function refuse(o) { pending = null; sig = 'pending'; render(o); window.api.hold(6000); toast(o.note, 6000); }
  async function checkDrop(files, id) {
    if (!files.length) return toast('Nessun file ricevuto dal rilascio', 4000);
    const types = await window.api.pathKinds(files);
    const dirs = files.filter((f, i) => types[i] === 'dir');
    if (dirs.length) { // cartelle (anche insieme a file): l'unica cosa possibile è comprimerle in uno ZIP
      const label = dirs.length === files.length ? (dirs.length > 1 ? `${dirs.length} cartelle` : 'Cartella') : 'Cartelle e file';
      if (id === 'zip:create') return run(files, id);
      pending = files; sig = 'pending';
      render({ label, targets: [], actions: ['zip:create'] });
      window.api.hold(10000);
      return toast(`${label}: clicca “Comprimi in ZIP” (con le cartelle si può fare solo questo)`, 9000);
    }
    const kinds = files.map(kindOfPath);
    const bad = files.filter((f, i) => !kinds[i]);
    if (bad.length) {
      const ext = [...new Set(bad.map((f) => { const n = String(f).split(/[\\/]/).pop(); return n.includes('.') ? '.' + n.split('.').pop().toLowerCase() : n; }))].join(', ');
      return refuse(none(['Formato non', 'supportato'], `${ext}: formato non supportato da DragWheel${files.length > bad.length ? ' (togli questi file e riprova)' : ''}`));
    }
    const o = optionsForKinds(kinds, files.length);
    if (!o.targets.length && !o.actions.length) return refuse(o);
    if (id && (o.targets.some((t) => t.id === id) || o.actions.includes(id))) return run(files, id);
    pending = files; sig = 'pending';
    render(o);
    window.api.hold(10000);
    toast(`È un file ${o.label || ''}: clicca l’opzione che vuoi`, 9000);
  }

  function target(node, id) {
    node.addEventListener('dragenter', (e) => { e.preventDefault(); node.classList.add('hot'); });
    node.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; node.classList.add('hot'); });
    node.addEventListener('dragleave', () => node.classList.remove('hot'));
    node.addEventListener('drop', (e) => {
      e.preventDefault();
      node.classList.remove('hot');
      const files = window.api.takeDropPaths();
      window.api.log(`drop su ${id}: files=${e.dataTransfer.files.length} types=${[...e.dataTransfer.types]} paths=${JSON.stringify(files)}`);
      checkDrop(files, id);
    });
    node.addEventListener('click', () => { if (pending) { const f = pending; pending = null; run(f, id); } });
  }

  // opts = null: ruota neutra in attesa di un file
  let lastOpts = null, glassUrl = null; // glassUrl: foto dello schermo sotto la ruota (data URL) o null
  function render(opts) {
    lastOpts = opts;
    svg.replaceChildren();
    svg.classList.toggle('glass', !!glassUrl);
    defs();
    const w = el('g', { id: 'wheel' }); // l'ombra è su tutto il gruppo
    frame(w);
    const n = opts ? opts.targets.length : 0, step = 360 / Math.max(n, 1);
    for (let i = 0; i < n; i++) {
      const t = opts.targets[i], mid = -90 + i * step, g = el('g', {}, w);
      const node = n === 1
        ? el('path', { class: 'seg', 'fill-rule': 'evenodd', d: `M${C - R_OUT} ${C}a${R_OUT} ${R_OUT} 0 1 0 ${2 * R_OUT} 0a${R_OUT} ${R_OUT} 0 1 0 ${-2 * R_OUT} 0zM${C - R_IN} ${C}a${R_IN} ${R_IN} 0 1 1 ${2 * R_IN} 0a${R_IN} ${R_IN} 0 1 1 ${-2 * R_IN} 0z` }, g) // un solo petalo: corona intera
        : el('path', { class: 'seg', d: petalPath(R_IN, R_OUT, mid - step / 2, mid + step / 2, 12, 32, 20) }, g);
      const [tx, ty] = pt((R_OUT + R_IN) / 2, mid);
      label(tx, ty, t.label, 't-ring', g);
      target(node, t.id);
    }
    hub(w);
    const actions = opts ? opts.actions : [];
    if (actions.length === 1) { // un'azione sola: cerchio intero
      const g = el('g', {}, w);
      const c = el('circle', { cx: C, cy: C, r: R_C, class: 'cseg' }, g);
      icon(actions[0], C, C - 17, 26, g);
      label(C, C + 20, LABEL[actions[0]], 't-act', g);
      target(c, actions[0]);
    } else if (actions.length > 1) { // più azioni: il cerchio si divide in petali
      const m = actions.length, st = 360 / m;
      actions.forEach((a, i) => {
        const mid = -90 + i * st, g = el('g', {}, w);
        const seg = el('path', { class: 'cseg', d: petalPath(16, R_C, mid - st / 2 + 0, mid + st / 2, 11, 16, 7) }, g);
        const [tx, ty] = pt(R_C * (m === 2 ? .52 : m === 3 ? .58 : .6), mid);
        const extra = LABEL[a].split('\n').length - 1; // righe oltre la prima
        icon(a, tx, ty - 11, 22, g);
        label(tx, ty + 11 + extra * 6, LABEL[a], 't-act', g, 12);
        target(seg, a);
      });
    } else {
      pill(!opts ? ['Trascina', 'un file'] : opts.pill || [opts.label || ''], w);
    }
  }

  // La ruota compare all'inizio del trascinamento, quando non si sa ancora che file è: parte neutra e si
  // ridisegna appena il drag entra nella finestra e ne rivela il tipo (MIME).
  let sig = null;
  function onDrag(e) {
    const mimes = [...(e.dataTransfer?.items || [])].filter((i) => i.kind === 'file').map((i) => i.type);
    const s = mimes.join('|');
    if (s === sig) return;
    sig = s;
    window.api.log(`tipi in arrivo: ${JSON.stringify(mimes)}`);
    const o = optionsForTypes(mimes);
    render(o);
    if (o && o.note) toast(o.note, 5000);
  }
  document.addEventListener('dragenter', onDrag);
  document.addEventListener('dragover', (e) => { e.preventDefault(); onDrag(e); });
  // rilascio fuori dalle opzioni (sulla pillola centrale o sul bordo): si controlla comunque che cosa è stato trascinato
  document.addEventListener('drop', (e) => {
    if (e.defaultPrevented) return; // già gestito da un'opzione
    e.preventDefault();
    const files = window.api.takeDropPaths();
    window.api.log(`drop fuori dalle opzioni: paths=${JSON.stringify(files)}`);
    checkDrop(files, null);
  });
  window.api.onReset(() => { sig = null; pending = null; msg.classList.remove('on'); render(null); });
  window.api.onGlass((url) => { glassUrl = url; render(lastOpts); }); // arriva subito dopo il reset, prima che la ruota sia visibile

  let timer;
  function toast(text, ms = 2600) {
    msg.textContent = text; msg.classList.add('on');
    clearTimeout(timer); timer = setTimeout(() => msg.classList.remove('on'), ms);
  }

  render(null);
</script>
