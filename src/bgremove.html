<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self' file: 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; media-src 'self' file: data: blob:; worker-src 'self' file: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Rimuovi sfondo</title>
<link rel="stylesheet" href="tool.css">
<script src="tool-chrome.js"></script>
<style>
  body { padding: 0; gap: 0; overflow: hidden; }
  header, footer { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-color: var(--line); }
  header { border-bottom: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); }
  main { flex: 1; min-height: 0; display: flex; }
  aside { width: 232px; padding: 12px 14px; border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  aside h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .6; margin: 0 0 6px; font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .tools button { width: 100%; text-align: left; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .tools .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .tools kbd { margin-left: auto; opacity: .55; font: 11px 'Segoe UI'; }
  .row2 { display: flex; gap: 6px; }
  .row2 button { flex: 1; padding: 5px 4px; }
  .sl { display: block; margin-bottom: 10px; font-size: 13px; }
  .sl span { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .sl output { opacity: .7; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .sw { display: flex; gap: 6px; flex-wrap: wrap; }
  .sw i { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--line); cursor: pointer; }
  .sw i.on { border-color: var(--accent); }
  #view { flex: 1; position: relative; overflow: hidden; background: rgba(48, 30, 20, .72); touch-action: none; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: 0 2px 18px rgba(0,0,0,.5); }
  #cv { display: block; }
  .checker { background-color: #d9d9d9; background-image: linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%), linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%); background-position: 0 0, 8px 8px; background-size: 16px 16px; }
  #cursor { position: absolute; pointer-events: none; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6) inset, 0 0 0 1px rgba(0,0,0,.6); display: none; transform: translate(-50%, -50%); }
  #overlay { position: absolute; inset: 0; background: rgba(20,16,14,.72); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #fff; z-index: 5; }
  #overlay.on { display: flex; }
  .bar { width: 320px; height: 8px; background: rgba(255,255,255,.2); border-radius: 99px; overflow: hidden; flex: none; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  #zoomInfo { position: absolute; right: 10px; bottom: 8px; font-size: 12px; background: rgba(0,0,0,.55); color: #fff; padding: 2px 8px; border-radius: 99px; pointer-events: none; }
  #batch { flex: 1; padding: 18px 22px; display: none; flex-direction: column; gap: 14px; overflow-y: auto; }
  .item { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .item .bar { grid-column: 1 / -1; width: auto; height: 5px; background: var(--line); }
  .item.err { border-color: #d33; } .item.ok .st::before { content: '✓ '; color: #3a3; }
  .hint { opacity: .65; font-size: 12.5px; line-height: 1.4; }
</style>

<header>
  <strong>Rimuovi sfondo</strong><span id="name" class="hint"></span>
  <div class="sp"></div>
  <span class="hint">Modello</span>
  <div class="seg" id="models"><button data-m="fast" class="on" title="Più rapido (circa 3 secondi)">Veloce</button><button data-m="precise" title="Più accurato su scene complesse (10-20 secondi)">Preciso</button></div>
</header>

<main id="editor">
  <aside>
    <div class="tools">
      <h2>Ritocco</h2>
      <button data-t="restore" class="on"><i class="dot" style="background:#3c9"></i>Ripristina <kbd>R</kbd></button>
      <button data-t="erase"><i class="dot" style="background:#e55"></i>Cancella <kbd>E</kbd></button>
      <button data-t="pan"><i class="dot" style="background:#999"></i>Sposta <kbd>Spazio</kbd></button>
    </div>
    <div>
      <label class="sl"><span>Dimensione pennello <output id="oSize">40</output></span><input type="range" id="size" min="2" max="300" value="40"></label>
      <label class="sl"><span>Morbidezza pennello <output id="oHard">70</output></span><input type="range" id="soft" min="0" max="100" value="30"></label>
      <div class="row2"><button id="undo" title="Ctrl+Z">Annulla</button><button id="redo" title="Ctrl+Y">Ripeti</button></div>
    </div>
    <div>
      <h2>Bordo</h2>
      <label class="sl"><span>Contorno <output id="oEdge">0</output></span><input type="range" id="edge" min="-6" max="6" step="1" value="0"></label>
      <label class="sl"><span>Sfumatura <output id="oSoft">0</output></span><input type="range" id="blur" min="0" max="8" step="0.5" value="0"></label>
      <div class="hint">Contorno negativo restringe il soggetto (toglie aloni), positivo lo allarga.</div>
    </div>
    <div>
      <h2>Anteprima su</h2>
      <div class="sw" id="sw"></div>
      <button id="orig" style="width:100%;margin-top:10px" title="Tieni premuto (tasto C)">Tieni premuto: originale</button>
    </div>
  </aside>
  <section id="view">
    <div id="stage" class="checker"><canvas id="cv"></canvas></div>
    <div id="cursor"></div>
    <div id="zoomInfo">100%</div>
    <div id="overlay"><div id="ovText">…</div><div class="bar"><i id="ovBar"></i></div></div>
  </section>
</main>

<div id="batch">
  <div class="hint" id="batchHint"></div>
  <div id="items"></div>
</div>

<footer>
  <span id="fp"></span>
  <span id="status" class="hint"></span><div class="sp"></div>
  <button id="reveal" style="display:none">Apri cartella</button>
  <button id="cancel">Chiudi</button><button id="save" class="primary" disabled>Salva</button>
</footer>

<script src="bg/alpha-ops.js"></script>
<script src="format-picker.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const fp = FormatPicker.mount($('fp'));
  const view = $('view'), stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
  let files = [], model = 'fast', curTool = 'restore';
  // dati a risoluzione di lavoro
  let W = 0, H = 0, rgb = null, base = null, adjusted = null, alpha = null, keep = null, remove = null, keepPrev = null, removePrev = null, img = null;
  let showOrig = false, edits = 0;
  let V = { s: 1, tx: 0, ty: 0 };
  const undoStack = [], redoStack = [];
  let lastSavedPath = null, busy = false;

  // ---------- avanzamento ----------
  const overlay = $('overlay');
  function showOverlay(text, p) { overlay.classList.add('on'); $('ovText').textContent = text; $('ovBar').style.width = Math.round((p || 0) * 100) + '%'; }
  const hideOverlay = () => overlay.classList.remove('on');
  window.bg.onProgress(({ stage, p }) => showOverlay(stage, p));

  // ---------- disegno ----------
  function renderRegion(x0, y0, w, h) {
    const d = img.data;
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
      const i = y * W + x;
      let a = adjusted[i];
      if (keep[i]) a += ((255 - a) * keep[i]) / 255;
      if (remove[i]) a = (a * (255 - remove[i])) / 255;
      alpha[i] = a + 0.5;
      d[i * 4 + 3] = showOrig ? 255 : alpha[i];
    }
    ctx.putImageData(img, 0, 0, x0, y0, w, h);
  }
  const renderAll = () => renderRegion(0, 0, W, H);
  function recomputeAdjusted() {
    adjusted = AlphaOps.adjust(base, W, H, +$('edge').value, +$('blur').value, 1);
    renderAll();
  }
  let adjTimer = null;
  const scheduleAdjust = () => { clearTimeout(adjTimer); adjTimer = setTimeout(recomputeAdjusted, 40); };

  // ---------- vista (zoom / sposta) ----------
  function applyView() {
    stage.style.transform = `translate(${V.tx}px, ${V.ty}px) scale(${V.s})`;
    stage.style.backgroundSize = `${16 / V.s}px ${16 / V.s}px`;
    stage.style.backgroundPosition = `0 0, ${8 / V.s}px ${8 / V.s}px`;
    cv.style.imageRendering = V.s > 2.5 ? 'pixelated' : 'auto';
    $('zoomInfo').textContent = Math.round(V.s * 100) + '%';
  }
  function fit() {
    const r = view.getBoundingClientRect();
    V.s = Math.min((r.width - 40) / W, (r.height - 40) / H, 1);
    V.tx = (r.width - W * V.s) / 2; V.ty = (r.height - H * V.s) / 2;
    applyView();
  }
  function zoomAt(cx, cy, k) {
    const ns = Math.min(16, Math.max(0.05, V.s * k));
    V.tx = cx - ((cx - V.tx) / V.s) * ns; V.ty = cy - ((cy - V.ty) / V.s) * ns; V.s = ns; applyView();
  }
  view.addEventListener('wheel', (e) => { e.preventDefault(); const r = view.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
  const toImage = (e) => { const r = view.getBoundingClientRect(); return [(e.clientX - r.left - V.tx) / V.s, (e.clientY - r.top - V.ty) / V.s]; };

  // ---------- pennello ----------
  const brush = () => ({ R: Math.max(0.5, +$('size').value / 2 / V.s), hard: 1 - +$('soft').value / 100 });
  let dirty = null;
  function stamp(cx, cy, mode, R, hard) {
    const x0 = Math.max(0, Math.floor(cx - R)), x1 = Math.min(W - 1, Math.ceil(cx + R));
    const y0 = Math.max(0, Math.floor(cy - R)), y1 = Math.min(H - 1, Math.ceil(cy + R));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
      if (d > R) continue;
      const w = d <= R * hard ? 1 : (R - d) / (R * (1 - hard) + 1e-6);
      const i = y * W + x, v = Math.round(255 * w);
      if (mode === 'restore') { if (v > keep[i]) keep[i] = v; remove[i] = Math.round(remove[i] * (1 - w)); }
      else { if (v > remove[i]) remove[i] = v; keep[i] = Math.round(keep[i] * (1 - w)); }
    }
    dirty = dirty ? { x0: Math.min(dirty.x0, x0), y0: Math.min(dirty.y0, y0), x1: Math.max(dirty.x1, x1), y1: Math.max(dirty.y1, y1) } : { x0, y0, x1, y1 };
  }
  let stroke = null;
  function strokeTo(px, py) {
    const { R, hard } = brush();
    const step = Math.max(1, R * 0.25);
    const dist = Math.hypot(px - stroke.x, py - stroke.y), n = Math.max(1, Math.ceil(dist / step));
    for (let k = 1; k <= n; k++) stamp(stroke.x + ((px - stroke.x) * k) / n, stroke.y + ((py - stroke.y) * k) / n, curTool, R, hard);
    stroke.x = px; stroke.y = py;
    if (dirty) { renderRegion(dirty.x0, dirty.y0, dirty.x1 - dirty.x0 + 1, dirty.y1 - dirty.y0 + 1); stroke.box = stroke.box ? { x0: Math.min(stroke.box.x0, dirty.x0), y0: Math.min(stroke.box.y0, dirty.y0), x1: Math.max(stroke.box.x1, dirty.x1), y1: Math.max(stroke.box.y1, dirty.y1) } : dirty; dirty = null; }
  }
  const slice = (src, b) => { const w = b.x1 - b.x0 + 1, out = new Uint8Array(w * (b.y1 - b.y0 + 1)); for (let y = b.y0; y <= b.y1; y++) out.set(src.subarray(y * W + b.x0, y * W + b.x1 + 1), (y - b.y0) * w); return out; };
  const paste = (dst, b, data) => { const w = b.x1 - b.x0 + 1; for (let y = b.y0; y <= b.y1; y++) dst.set(data.subarray((y - b.y0) * w, (y - b.y0 + 1) * w), y * W + b.x0); };
  function endStroke() {
    if (!stroke) return;
    const b = stroke.box; stroke = null;
    if (!b) return;
    undoStack.push({ b, bk: slice(keepPrev, b), br: slice(removePrev, b), ak: slice(keep, b), ar: slice(remove, b) });
    if (undoStack.length > 40) undoStack.shift();
    redoStack.length = 0;
    paste(keepPrev, b, slice(keep, b)); paste(removePrev, b, slice(remove, b));
    edits++; updateButtons();
  }
  function applyEntry(e, before) {
    paste(keep, e.b, before ? e.bk : e.ak); paste(remove, e.b, before ? e.br : e.ar);
    paste(keepPrev, e.b, before ? e.bk : e.ak); paste(removePrev, e.b, before ? e.br : e.ar);
    renderRegion(e.b.x0, e.b.y0, e.b.x1 - e.b.x0 + 1, e.b.y1 - e.b.y0 + 1);
  }
  function undo() { const e = undoStack.pop(); if (!e) return; applyEntry(e, true); redoStack.push(e); edits--; updateButtons(); }
  function redo() { const e = redoStack.pop(); if (!e) return; applyEntry(e, false); undoStack.push(e); edits++; updateButtons(); }
  function updateButtons() { $('undo').disabled = !undoStack.length; $('redo').disabled = !redoStack.length; }

  // ---------- puntatore ----------
  let pan = null, spaceDown = false;
  const cursor = $('cursor');
  function moveCursor(e) {
    if (curTool === 'pan' || spaceDown) { cursor.style.display = 'none'; return; }
    const r = view.getBoundingClientRect(), s = +$('size').value;
    Object.assign(cursor.style, { display: 'block', left: e.clientX - r.left + 'px', top: e.clientY - r.top + 'px', width: s + 'px', height: s + 'px', borderColor: curTool === 'restore' ? '#6fe0a8' : '#ff8a8a' });
  }
  view.addEventListener('pointerdown', (e) => {
    if (!img || busy) return;
    view.setPointerCapture(e.pointerId);
    if (curTool === 'pan' || spaceDown || e.button === 1) { pan = { x: e.clientX - V.tx, y: e.clientY - V.ty }; return; }
    if (e.button !== 0) return;
    const [px, py] = toImage(e);
    stroke = { x: px, y: py, box: null };
    strokeTo(px, py);
  });
  view.addEventListener('pointermove', (e) => {
    moveCursor(e);
    if (pan) { V.tx = e.clientX - pan.x; V.ty = e.clientY - pan.y; applyView(); }
    else if (stroke) { const [px, py] = toImage(e); strokeTo(px, py); }
  });
  const up = () => { pan = null; endStroke(); };
  view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
  view.addEventListener('pointerleave', () => { cursor.style.display = 'none'; });

  // ---------- controlli ----------
  document.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.t)));
  function setTool(t) { curTool = t; document.querySelectorAll('[data-t]').forEach((x) => x.classList.toggle('on', x.dataset.t === t)); view.style.cursor = t === 'pan' ? 'grab' : 'crosshair'; }
  $('size').addEventListener('input', () => { $('oSize').textContent = $('size').value; });
  $('soft').addEventListener('input', () => { $('oHard').textContent = $('soft').value; });
  $('edge').addEventListener('input', () => { $('oEdge').textContent = $('edge').value; scheduleAdjust(); });
  $('blur').addEventListener('input', () => { $('oSoft').textContent = $('blur').value; scheduleAdjust(); });
  $('undo').addEventListener('click', undo); $('redo').addEventListener('click', redo);

  const SWATCHES = [['checker', null], ['#ffffff', '#fff'], ['#000000', '#000'], ['#3a8f5c', '#3a8f5c'], ['#c026d3', '#c026d3'], ['#2f6fed', '#2f6fed']];
  for (const [k, c] of SWATCHES) {
    const i = document.createElement('i');
    i.dataset.k = k; if (!c) { i.className = 'checker on'; i.style.backgroundSize = '8px 8px'; i.style.backgroundPosition = '0 0, 4px 4px'; } else i.style.background = c;
    i.addEventListener('click', () => {
      $('sw').querySelectorAll('i').forEach((x) => x.classList.toggle('on', x === i));
      stage.classList.toggle('checker', !c); stage.style.backgroundColor = c || ''; if (c) { stage.style.backgroundImage = 'none'; } else { stage.style.backgroundImage = ''; applyView(); }
    });
    $('sw').append(i);
  }
  const setOrig = (v) => { if (showOrig !== v && img) { showOrig = v; renderAll(); } };
  $('orig').addEventListener('pointerdown', () => setOrig(true));
  addEventListener('pointerup', () => setOrig(false));

  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    const k = e.key.toLowerCase();
    if (e.ctrlKey && k === 'z') { e.preventDefault(); undo(); }
    else if (e.ctrlKey && (k === 'y' || (e.shiftKey && k === 'z'))) { e.preventDefault(); redo(); }
    else if (e.ctrlKey && k === 's') { e.preventDefault(); save(); }
    else if (k === 'escape') window.tool.close();
    else if (k === 'r') setTool('restore'); else if (k === 'e') setTool('erase');
    else if (k === 'c') setOrig(true);
    else if (k === ' ') { spaceDown = true; view.style.cursor = 'grab'; e.preventDefault(); }
    else if (k === '[') { $('size').value = Math.max(2, +$('size').value - 6); $('size').dispatchEvent(new Event('input')); }
    else if (k === ']') { $('size').value = Math.min(300, +$('size').value + 6); $('size').dispatchEvent(new Event('input')); }
    else if (k === '0') fit();
    else if (k === '+' || k === '=') { const r = view.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.25); }
    else if (k === '-') { const r = view.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.25); }
  });
  addEventListener('keyup', (e) => { if (e.key.toLowerCase() === 'c') setOrig(false); if (e.key === ' ') { spaceDown = false; setTool(curTool); } });
  addEventListener('resize', () => { if (img) fit(); });

  document.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => {
    if (busy || b.dataset.m === model) return;
    model = b.dataset.m; document.querySelectorAll('[data-m]').forEach((x) => x.classList.toggle('on', x === b));
    if (files.length === 1) analyze();
  }));

  // ---------- analisi e salvataggio (una sola immagine) ----------
  const errText = (e) => String(e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');
  async function analyze() {
    busy = true; $('save').disabled = true; $('status').textContent = '';
    showOverlay('Avvio…', 0.02);
    try {
      const r = await window.bg.analyze(model);
      const first = !img;
      if (first || r.workW !== W || r.workH !== H) {
        W = r.workW; H = r.workH;
        rgb = r.rgb; keep = new Uint8Array(W * H); remove = new Uint8Array(W * H); keepPrev = new Uint8Array(W * H); removePrev = new Uint8Array(W * H); alpha = new Uint8Array(W * H);
        cv.width = W; cv.height = H; img = ctx.createImageData(W, H);
        for (let i = 0, n = W * H; i < n; i++) { img.data[i * 4] = rgb[i * 3]; img.data[i * 4 + 1] = rgb[i * 3 + 1]; img.data[i * 4 + 2] = rgb[i * 3 + 2]; }
        stage.style.width = W + 'px'; stage.style.height = H + 'px';
      }
      base = new Uint8Array(r.base);
      recomputeAdjusted();
      if (first) fit();
      $('status').textContent = `${r.width} × ${r.height} px${r.width !== W ? ` (anteprima ${W} × ${H})` : ''}`;
      $('save').disabled = false;
    } catch (e) { $('status').textContent = 'Errore: ' + errText(e); }
    busy = false; hideOverlay(); updateButtons();
  }
  async function save() {
    if (busy || !img) return;
    busy = true; $('save').disabled = true; showOverlay('Salvataggio…', 0.05);
    try {
      const res = await window.bg.export({ edge: +$('edge').value, soft: +$('blur').value, keep, remove, ...fp.get() });
      lastSavedPath = res.outPath;
      $('status').textContent = '✓ Salvato: ' + res.outPath.split(/[\\/]/).pop();
      $('reveal').style.display = '';
    } catch (e) { $('status').textContent = 'Errore: ' + errText(e); }
    busy = false; hideOverlay(); $('save').disabled = false;
  }
  $('save').addEventListener('click', () => (files.length === 1 ? save() : runBatch()));
  $('cancel').addEventListener('click', () => window.tool.close());
  $('reveal').addEventListener('click', () => lastSavedPath && window.bg.reveal(lastSavedPath));

  // ---------- più immagini: elaborazione automatica ----------
  function setupBatch() {
    $('editor').style.display = 'none'; $('batch').style.display = 'flex';
    $('batchHint').textContent = `${files.length} immagini: la rimozione è automatica, senza ritocchi. Ogni file viene salvato accanto all’originale come “nome No Background.png”. Per ritoccare un’immagine, trascinala da sola.`;
    $('save').textContent = 'Avvia'; $('save').disabled = false;
    files.forEach((f, i) => {
      const d = document.createElement('div'); d.className = 'item'; d.id = 'it' + i;
      d.innerHTML = `<span></span><span class="st hint">in attesa</span><div class="bar"><i></i></div>`;
      d.firstChild.textContent = f.split(/[\\/]/).pop();
      $('items').append(d);
    });
    window.bg.onBatch((m) => {
      const it = $('it' + m.index);
      if (m.error) { it.classList.add('err'); it.querySelector('.st').textContent = m.error; }
      else if (m.done) { it.classList.add('ok'); it.querySelector('.st').textContent = 'salvato'; it.querySelector('i').style.width = '100%'; lastSavedPath = m.outPath; }
      else { it.querySelector('.st').textContent = m.stage; it.querySelector('i').style.width = Math.round(m.p * 100) + '%'; }
    });
  }
  async function runBatch() {
    busy = true; $('save').disabled = true; document.querySelectorAll('[data-m]').forEach((b) => (b.disabled = true));
    $('status').textContent = 'Elaborazione in corso…';
    const res = await window.bg.batch(model, fp.get());
    const ok = res.filter((r) => r.outPath).length;
    $('status').textContent = `${ok}/${res.length} immagini elaborate`;
    $('reveal').style.display = ok ? '' : 'none'; busy = false;
  }

  // ---------- avvio ----------
  setTool('restore'); updateButtons(); applyView();
  window.tool.init().then(({ files: f, output }) => {
    fp.set(output);
    files = f;
    $('name').textContent = f.length === 1 ? f[0].split(/[\\/]/).pop() : `${f.length} immagini`;
